        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --text-color: #FFFFFF;
            --bg-color: #7A3A08;
            --liquid-color: #7A3A08;
            --widget-opacity: 1.0;
            --halo-color: 0,0,0;
            --lamp-count: 1;
            --u: 1vh;
            --font-label: calc(var(--u) * 4.2);
        }
        /* Typography unit: 1vh for M, L and XL; 2vh for HS; 1vw for VS and portrait */
        @media (min-aspect-ratio: 2427/1000) and (max-aspect-ratio: 299/100) { :root { --u: 2vh; } }
        @media (max-aspect-ratio: 199/100) { :root { --u: 1vw; } }
        @media (max-aspect-ratio: 150/100) and (min-aspect-ratio: 90/100) { :root { --u: 1vh; } }

        /* Lamp style: lamps per slot. HXL 6, HS/HL 4, VS 2, HM 2, portrait 1 (the default) */
        @media (min-aspect-ratio: 300/100) { :root { --lamp-count: 6; } }
        @media (min-aspect-ratio: 200/100) and (max-aspect-ratio: 299/100) { :root { --lamp-count: 4; } }
        @media (min-aspect-ratio: 90/100) and (max-aspect-ratio: 199/100) { :root { --lamp-count: 2; } }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Jost', sans-serif; font-weight: 600;
            background: transparent;
            color: var(--text-color);
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        .widget-background {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none;
        }
        #media-background {
            position: relative; width: 100%; height: 100%;
            filter: blur(var(--bg-blur, 0px));
            will-change: filter;
        }
        .position-container { position: absolute; transform-origin: top left; }
        .scale-container { transform-origin: top left; }
        .rotation-container { transform-origin: center center; }
        .rotation-container img, .rotation-container video { display: block; object-fit: contain; }

        /* No inset padding: canvas effects extend to edges.
           Fill style: no container background (the shader draws the liquid with its own alpha).
           Lamp style: the backdrop around the lamps is the widget background. */
        .container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            z-index: 1;
            touch-action: none;
        }
        .container.lamp-style {
            background-color: color-mix(in srgb, var(--bg-color), transparent calc((1 - var(--widget-opacity)) * 100%));
        }
        .container.no-gl {
            background: linear-gradient(to top,
                color-mix(in srgb, var(--liquid-color), transparent calc((1 - var(--widget-opacity)) * 100%)),
                color-mix(in srgb, color-mix(in srgb, var(--liquid-color) 55%, #000000), transparent calc((1 - var(--widget-opacity)) * 100%)));
        }
        .container.no-gl #gl, .container.no-gl #overlay { display: none; }

        #gl, #overlay {
            position: absolute; left: 0; top: 0;
            width: 100%; height: 100%;
            display: block;
        }
        #gl { z-index: 1; }
        #overlay { z-index: 2; display: none; pointer-events: none; }
        .container.lamp-style:not(.no-gl) #overlay { display: block; }

        .widget-title {
            display: none;
            position: absolute;
            top: calc(var(--u) * 2);
            left: calc(var(--u) * 4);
            right: calc(var(--u) * 4);
            z-index: 10;
            font-family: 'Jost', sans-serif; font-weight: 700;
            font-size: var(--font-label);
            line-height: 1.2;
            text-align: center;
            color: var(--text-color);
            /* The halo is dark for light text and light for dark text, so the opaque title stays legible over the wax.
               Padding with a matching negative margin gives the halo room inside the ellipsis clip. */
            text-shadow: 0 0 0.6em rgba(var(--halo-color), 0.85), 0 0 0.2em rgba(var(--halo-color), 0.9);
            padding: 0.6em;
            margin: -0.6em;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
        }
    </style>

    <script type="x-shader/x-vertex" id="vs">
#version 300 es
in vec2 aPos;
void main() {
    gl_Position = vec4(aPos, 0.0, 1.0);
}
    </script>

    <script type="x-shader/x-fragment" id="fs">
#version 300 es
precision highp float;
precision highp int;

uniform vec4 uBlobs[64];      // x, y, kernel r, stretch (lamp units)
uniform vec4 uTails[64];      // x, y, kernel r, weight
uniform vec4 uPool[6];        // x0, x1, y, thickness * KERNEL_R (per lamp)
uniform vec4 uLampRect[6];    // interior rect in buffer px: x0, y0, width, height (bottom-left origin)
uniform ivec2 uLampSlice[6];  // first slot, active count
uniform int uLampCount;
uniform int uStyle;           // 0 = Fill, 1 = Lamp
uniform vec3 uWax;
uniform vec3 uLiquid;
uniform float uOpacity;       // transparency / 100
uniform float uTime;
uniform vec2 uResolution;
uniform vec2 uBottle;         // x = glass top width ratio, y = corner radius (lamp units)

out vec4 fragColor;

const float ISO = 0.3;
const float NORMAL_K = 0.1;
const float DEPTH_K = 0.35;   // field distance over which the wax depth saturates
const float SHEEN = 0.08;     // wide dim sheen: one fifth of the probe's 0.4. Set 0.0 to remove.
const float RIM = 0.1;        // Fresnel rim: a trace only

// Isosceles trapezoid SDF (Inigo Quilez). r1 = bottom half-width, r2 = top half-width, he = half-height.
float sdTrapezoid(vec2 p, float r1, float r2, float he) {
    vec2 k1 = vec2(r2, he);
    vec2 k2 = vec2(r2 - r1, 2.0 * he);
    p.x = abs(p.x);
    vec2 ca = vec2(p.x - min(p.x, (p.y < 0.0) ? r1 : r2), abs(p.y) - he);
    vec2 cb = p - k1 + k2 * clamp(dot(k1 - p, k2) / dot(k2, k2), 0.0, 1.0);
    float s = (cb.x < 0.0 && ca.y < 0.0) ? -1.0 : 1.0;
    return s * sqrt(min(dot(ca, ca), dot(cb, cb)));
}

void main() {
    vec2 frag = gl_FragCoord.xy;
    int li = 0;
    if (uStyle == 1) {
        float cellW = uResolution.x / float(uLampCount);
        li = clamp(int(floor(frag.x / cellW)), 0, uLampCount - 1);
    }
    vec4 rect = uLampRect[li];
    float pxPerUnit = max(rect.w, 1.0);
    float aspect = rect.z / pxPerUnit;
    vec2 p = (frag - rect.xy) / pxPerUnit;

    float mask = 1.0;
    float taper = 1.0;
    if (uStyle == 1) {
        taper = uBottle.x;
        float R = uBottle.y;
        float sd = sdTrapezoid(p - vec2(0.5 * aspect, 0.5), 0.5 * aspect - R, 0.5 * aspect * taper - R, 0.5 - R) - R;
        mask = clamp(0.5 - sd * pxPerUnit, 0.0, 1.0);
        if (mask <= 0.0) { fragColor = vec4(0.0); return; }
    }

    // ---- Metaball field: Wyvill kernel (1 - (d/2r)^2)^3, support 2r, analytic gradient
    float F = 0.0;
    vec2 g = vec2(0.0);
    ivec2 sl = uLampSlice[li];
    for (int k = 0; k < 64; k++) {
        if (k >= sl.y) break;

    vec3 liq = uLiquid * mix(1.15, 0.55, yy);

        glow = exp(-dot(bd, bd)) * 0.7;

        float cx = (p.x - 0.5 * aspect) / (0.3 * aspect);
        glow = exp(-(p.y * p.y) / 0.01) * (0.3 + 0.4 * exp(-cx * cx));
    }
    liq += glowCol * glow;
    float shimmer = sin(p.x * 9.0 + uTime * 0.4 + 2.0 * sin(p.y * 4.0 - uTime * 0.25)) * sin(p.y * 7.0 - uTime * 0.3 + p.x * 2.0);
    liq *= 1.0 + 0.035 * shimmer;
    float hw = 0.5 * aspect * (1.0 - (1.0 - taper) * yy);
    float u = 0.5 + 0.5 * (p.x - 0.5 * aspect) / hw;
    float gx = smoothstep(0.0, 0.08, u) * smoothstep(0.0, 0.08, 1.0 - u);
    liq *= 0.6 + 0.4 * gx;
    // pow needs a non-negative base (GLSL ES 3.00): square the absolute offset
    float hl = 0.10 * exp(-pow(abs(u - 0.2) / 0.03, 2.0)) + 0.06 * exp(-pow(abs(u - 0.8) / 0.018, 2.0));

    // ---- Composite (premultiplied alpha)

    a = clamp(a + hl, 0.0, 1.0);
    fragColor = vec4(min(pre, vec3(a)), a) * mask;

    <script>
        function resolveMediaPath(value) {
            if (!value) return '';
            if (typeof value === 'string') return value;
            if (value.pathToAsset) return value.pathToAsset;
            if (value.path) return value.path;
            if (value.value) return value.value;
            return '';
        }
        function normalizeMediaConfig(rawMedia) {
            var mediaPath = resolveMediaPath(rawMedia);
            if (!mediaPath) return null;
            var base = (rawMedia && typeof rawMedia === 'object') ? rawMedia : {};
            return {
                path: base.pathToAsset || mediaPath,
                baseWidth: Number(base.baseWidth) || 0,
                baseHeight: Number(base.baseHeight) || 0,
                scale: Number.isFinite(Number(base.scale)) ? Number(base.scale) : 1,
                positionX: Number(base.positionX) || 0,
                positionY: Number(base.positionY) || 0,
                angle: Number(base.angle) || 0
            };
        }
        var MediaViewer = (function() {
            var imgExts = ['jpg','jpeg','png','gif','bmp','webp','svg','ico'];
            var vidExts = ['mp4','webm','ogg','mov','avi','mkv'];
            function MV(opts) {
                this.container = opts.container;
                this.pos = null; this.scl = null; this.rot = null;
                this.media = null; this.curPath = null;
            }
            MV.prototype.loadMedia = function(p) {
                var path = p.path; if (!path) { this.clear(); return; }
                var decoded = decodeURIComponent(path);
                if (this.curPath === decoded) { this._transform(p); return; }
                this.clear();
                var ext = decoded.split('.').pop().toLowerCase();
                if (imgExts.indexOf(ext) !== -1) {
                    this.media = document.createElement('img');
                    this.media.src = decoded;
                } else if (vidExts.indexOf(ext) !== -1) {
                    this.media = document.createElement('video');
                    this.media.autoplay = true; this.media.loop = true;
                    this.media.muted = true; this.media.playsInline = true;
                    this.media.src = decoded;
                    this.media.play().catch(function(){});
                } else { return; }
                this.rot = document.createElement('div'); this.rot.className = 'rotation-container';
                this.scl = document.createElement('div'); this.scl.className = 'scale-container';
                this.pos = document.createElement('div'); this.pos.className = 'position-container';
                this.rot.appendChild(this.media);
                this.scl.appendChild(this.rot);
                this.pos.appendChild(this.scl);
                this.container.appendChild(this.pos);
                this.container.style.visibility = 'visible';
                this._transform(p); this.curPath = decoded;
            };
            MV.prototype._transform = function(p) {
                if (!this.pos) return;
                var bw = p.baseWidth || 100, bh = p.baseHeight || 100;
                var s = p.scale !== undefined ? p.scale : 1;
                var ms = Math.min(this.container.clientWidth / bw, this.container.clientHeight / bh);
                this.pos.style.transform = 'translate(' + (p.positionX || 0) * ms + 'px,' + (p.positionY || 0) * ms + 'px)';
                this.scl.style.transform = 'scale(' + s * ms + ')';
                this.rot.style.transform = 'rotate(' + (p.angle || 0) + 'deg)';
            };
            MV.prototype.clear = function() {
                this.container.innerHTML = '';
                this.container.style.visibility = 'hidden';
                this.pos = this.scl = this.rot = this.media = this.curPath = null;
            };
            return MV;
        })();

    <script>

            SUBSTEP: 1 / 60,
            MAX_DT: 0.1,
            TN: 0.5,
            HEAT_ZONE: 0.15,
            G: 3,
            KD: 1.0,
            KH: 0.012,
            KC: 0.009,
            KH_POOL: 0.35,
            KCONV: 0.05,
            KW: 20,
            KST: 0.3,
            KS: 8,
            KT: 8,
            POOL_MIN: 0.03,
            REF_AREA: 1.21,
            MERGE_COOLDOWN: 1.5,
            DRIP_T: 0.35,
            ABSORB_DEPTH: 1.0,
            HEAT_LO: 0.16,
            HEAT_HI: 2.0,
            STIR_R: 0.25,
            STIR_GAIN: 0.6,
            STIR_RATE: 20,
            STIR_TAU: 1.7,
            STIR_LIFE: 5,
            STIR_MAX_V: 3,
            STIR_SPLIT_V: 1.5,
            STIR_SPACING: 0.02,
            STIR_MAX_SAMPLES: 256,
            MERGE_MAX: 2.5,      // a merge never makes a blob larger than this many Vb
            MERGE_TIME: 0.5,     // seconds for the smaller blob to drain into the larger one
            KREP: 6,             // push between blobs that are too big to merge
            REP_RANGE: 2,        // that push reaches out to this many times r1 + r2

            return h <= 5 ? Math.pow(LAVA.HEAT_LO, (5 - h) / 4) : Math.pow(LAVA.HEAT_HI, (h - 5) / 5);

        function waxBudget(aspect, waxAmount, cap) {
            var t = (lavaClamp(Number(waxAmount) || 5, 1, 10) - 1) / 9;
            var A = aspect * 1;

        function stirFactor(age) {
            if (age < 0 || age >= LAVA.STIR_LIFE) return 0;
            return Math.exp(-age / LAVA.STIR_TAU);
        }

        function createSim(opts) {
            opts = opts || {};
            var rand = lavaPrng(opts.seed || 1);
            var cap = lavaClamp(opts.cap || LAVA.SLOTS, 1, LAVA.SLOTS);
            var heat = opts.heat || 5;
            var wax = opts.waxAmount || 5;
            var width = Math.max(0.05, opts.aspect || 1);

            var taper = opts.taper == null || !isFinite(taperIn) ? 1 : lavaClamp(taperIn, 0.5, 1);
            var budget = waxBudget(width, wax, cap);
            var s = heatScale(heat);
            var p1 = rand() * Math.PI * 2;
            var p2 = rand() * Math.PI * 2;

            var budTimer = 0.5 + 1.5 * rand();

                blobs: [],
                tails: [],
                samples: [],
                flows: [],
                pool: { vol: 0, T: 1, thickness: LAVA.POOL_MIN },
                time: 0,
                width: width,
                taper: taper,
                cap: cap,
                V: budget.V,
                N: budget.N,

                onBud: null

            function halfW(y) {

            }

            function makeBlob(x, y, vol, T) {
                return { id: nextId++, x: x, y: y, vx: 0, vy: 0, vol: vol, r: radiusOf(vol),

                a.id = b.id;

                for (var k = 0; k < sim.flows.length; k++) if (sim.flows[k].to === b) sim.flows[k].to = a;
                sim.blobs.splice(i, 1, a, c);
            }

            function mergeAndSplit(dt) {
                var i, j, k, b, c;
                var lim = LAVA.MERGE_MAX * sim.Vb;
                for (i = 0; i < sim.blobs.length; i++) {
                    b = sim.blobs[i];
                    if (b.mergeCooldown > 0 || b.drain) continue;
                    for (j = i + 1; j < sim.blobs.length; j++) {
                        c = sim.blobs[j];
                        if (c.mergeCooldown > 0 || c.drain) continue;
                        var dx = c.x - b.x, dy = c.y - b.y;
                        if (Math.sqrt(dx * dx + dy * dy) < 0.5 * (b.r + c.r)) {
                            var vb = b.vol + inbound(b), vc = c.vol + inbound(c);
                            if (vb + vc > lim) continue;
                            // The smaller one drains into the larger one over MERGE_TIME
                            var big = vb >= vc ? b : c, small = big === b ? c : b;
                            small.drain = 1;
                            big.target = 0; small.target = 0;
                            for (k = 0; k < sim.flows.length; k++) {
                                if (sim.flows[k].to === small) sim.flows[k].to = big;
                            }
                            addFlow(small, big, LAVA.MERGE_TIME);
                            sim.events.merges++;
                            if (small === b) break;
                        }
                    }
                }
                var rSplit = 1.4 * radiusOf(sim.Vb);
                for (i = 0; i < sim.blobs.length && sim.blobs.length < sim.cap; i++) {
                    b = sim.blobs[i];
                    if (!b.drain && b.vy > 0 && b.T > LAVA.TN && b.r > rSplit && b.stretch > 1.6 && b.mergeCooldown === 0) {
                        splitBlob(i, b.vx, b.vy);
                        sim.events.splits++;
                        i++;
                    }
                }
                for (i = 0; i < sim.blobs.length && sim.blobs.length < sim.cap; i++) {
                    b = sim.blobs[i];
                    if (!b.drain && b.y > 0.85 && b.T < LAVA.DRIP_T && b.vol > 2 * sim.Vb && rand() < 0.3 * dt) {
                        var dv = b.vol * 0.15;
                        b.vol -= dv; b.r = radiusOf(b.vol);
                        var d = makeBlob(b.x, Math.max(0, b.y - b.r * 0.9), dv, b.T);
                        d.vy = -0.02; d.vx = b.vx;
                        d.mergeCooldown = b.mergeCooldown = LAVA.MERGE_COOLDOWN;
                        sim.blobs.push(d);
                        sim.events.drips++;
                    }
                }
            }

            function poolExchange(dt) {
                var top = poolTop(), i, b;
                for (i = 0; i < sim.blobs.length; i++) {
                    b = sim.blobs[i];
                    if (b.target <= 0) continue;
                    if (b.y - b.r <= top) {
                        var flow = Math.min(sim.Vb * dt, b.target - b.vol, sim.pool.vol);
                        if (flow > 0) { b.vol += flow; sim.pool.vol -= flow; b.r = radiusOf(b.vol); }
                        b.T = Math.max(b.T, sim.pool.T);
                        if (b.vol >= b.target - 1e-12 || sim.pool.vol <= 0) b.target = 0;
                    } else {
                        b.target = 0;
                    }
                }
                top = poolTop();
                for (i = sim.blobs.length - 1; i >= 0; i--) {
                    b = sim.blobs[i];
                    // A free blob with no volume and nothing on its way in draws nothing: drop it
                    if (!b.drain && b.vol <= 0 && b.target <= 0 && inbound(b) === 0) { sim.blobs.splice(i, 1); continue; }
                    if (!b.drain && b.target <= 0 && b.T < LAVA.TN && b.y < top + LAVA.ABSORB_DEPTH * b.r && inbound(b) === 0) {
                        // It drains into the pool over ABSORB_TIME and sinks onto the surface
                        b.drain = 1;
                        addFlow(b, null, LAVA.ABSORB_TIME);
                        sim.events.absorbs++;
                    }
                }
                budTimer -= dt;
                var free = 0;
                for (i = 0; i < sim.blobs.length; i++) if (!sim.blobs[i].drain) free++;
                if (budTimer <= 0 && sim.pool.T > 0.7 && sim.pool.vol > sim.Vb &&
                    free < sim.N && sim.blobs.length < sim.cap) {
                    var target = sim.Vb * lavaLerp(0.6, 1.4, rand());
                    var rt = radiusOf(target);
                    var x = lavaLerp(Math.min(rt, sim.width / 2), Math.max(sim.width - rt, sim.width / 2), rand());
                    // The bud starts empty and grows only through the pool flow above
                    var bud = makeBlob(x, poolTop(), 0, 1);
                    bud.target = target;
                    bud.mergeCooldown = LAVA.MERGE_COOLDOWN;
                    sim.blobs.push(bud);
                    sim.events.buds++;
                    if (sim.onBud) sim.onBud(bud);
                    budTimer = 0.5 + 1.5 * rand();
                }
                sim.pool.thickness = poolTop();
            }

            function stirForces(dt) {
                var i, k, b, sm;
                for (k = sim.samples.length - 1; k >= 0; k--) {
                    if (sim.time - sim.samples[k].t0 >= LAVA.STIR_LIFE) sim.samples.splice(k, 1);
                }
                if (!sim.samples.length) return;
                var fArr = new Array(sim.samples.length);
                for (k = 0; k < sim.samples.length; k++) {
                    fArr[k] = stirFactor(sim.time - sim.samples[k].t0);
                }
                var R2 = LAVA.STIR_R * LAVA.STIR_R;
                for (i = 0; i < sim.blobs.length; i++) {
                    b = sim.blobs[i];
                    if (b.drain) continue;
                    var ksum = 0, fx = 0, fy = 0;
                    for (k = 0; k < sim.samples.length; k++) {
                        sm = sim.samples[k];
                        var dx = b.x - sm.x, dy = b.y - sm.y;
                        var d2 = dx * dx + dy * dy;
                        if (d2 >= R2) continue;
                        var q = 1 - d2 / R2;
                        var kw = q * q;
                        ksum += kw; fx += kw * fArr[k] * sm.vx; fy += kw * fArr[k] * sm.vy;
                    }
                    if (ksum < 1e-9) continue;
                    var tx = LAVA.STIR_GAIN * fx / ksum, ty = LAVA.STIR_GAIN * fy / ksum;
                    var a = Math.min(1, LAVA.STIR_RATE * dt * Math.min(1, ksum));
                    b.vx += (tx - b.vx) * a;
                    b.vy += (ty - b.vy) * a;
                }
            }

            function updateTails() {
                sim.tails.length = sim.blobs.length;
                for (var i = 0; i < sim.blobs.length; i++) {
                    var b = sim.blobs[i];
                    var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
                    var w = lavaClamp(LAVA.KT * sp, 0, 1);
                    var tl = sim.tails[i] || (sim.tails[i] = { x: 0, y: 0, r: 0, w: 0 });
                    if (sp < 1e-6 || w < 0.01) { tl.x = b.x; tl.y = b.y; tl.r = 0; tl.w = 0; continue; }
                    tl.x = b.x - b.vx / sp * 0.8 * b.r;
                    tl.y = b.y - b.vy / sp * 0.8 * b.r;
                    tl.r = 0.5 * b.r;
                    tl.w = w;
                }
            }

            function substep(dt) {
                sim.time += dt;
                thermal(dt);
                forces(dt);
                integrate(dt);
                mergeAndSplit(dt);
                runFlows(dt);
                poolExchange(dt);
                stirForces(dt);
            }

            sim.step = function (dt) {
                dt = lavaClamp(Number(dt) || 0, 0, LAVA.MAX_DT);
                acc += dt;
                var n = Math.floor(acc / LAVA.SUBSTEP + 1e-9);
                acc -= n * LAVA.SUBSTEP;
                if (acc < 0) acc = 0;
                for (var i = 0; i < n; i++) substep(LAVA.SUBSTEP);
                updateTails();
            };

            sim.stir = function (x, y, vx, vy) {
                if (!isFinite(x) || !isFinite(y) || !isFinite(vx) || !isFinite(vy)) return;
                var sp = Math.sqrt(vx * vx + vy * vy);
                if (!(sp > 1e-3)) return;
                if (sp > LAVA.STIR_MAX_V) { vx *= LAVA.STIR_MAX_V / sp; vy *= LAVA.STIR_MAX_V / sp; sp = LAVA.STIR_MAX_V; }
                var last = sim.samples[sim.samples.length - 1];
                if (last &&
                    (last.x - x) * (last.x - x) + (last.y - y) * (last.y - y) < LAVA.STIR_SPACING * LAVA.STIR_SPACING) {
                    last.vx = vx; last.vy = vy; last.t0 = sim.time;
                } else {
                    sim.samples.push({ x: x, y: y, vx: vx, vy: vy, t0: sim.time });
                    if (sim.samples.length > LAVA.STIR_MAX_SAMPLES) sim.samples.shift();
                }
                if (sp <= LAVA.STIR_SPLIT_V || sim.blobs.length >= sim.cap) return;
                var best = -1, bestD = Infinity;
                for (var i = 0; i < sim.blobs.length; i++) {
                    var b = sim.blobs[i];
                    var d = Math.sqrt((b.x - x) * (b.x - x) + (b.y - y) * (b.y - y));
                    if (!b.drain && d < b.r && d < bestD && b.mergeCooldown === 0 && b.vol >= 0.5 * sim.Vb) { best = i; bestD = d; }
                }
                if (best >= 0) {
                    // Split along the stroke: the halves sit on either side of the stroke line
                    splitBlob(best, vx, vy);
                    sim.events.stirSplits++;
                }
            };

            sim.setHeat = function (h) { heat = h; s = heatScale(h); };
            sim.setWaxAmount = function (w) { wax = w; applyBudget(); };
            sim.resize = function (aspect) {
                var nw = Math.max(0.05, Number(aspect) || sim.width);
                var sx = nw / sim.width;
                for (var i = 0; i < sim.blobs.length; i++) sim.blobs[i].x *= sx;
                for (var k = 0; k < sim.samples.length; k++) sim.samples[k].x *= sx;
                sim.width = nw;
                applyBudget();
            };
            sim.total = function () {
                var t = sim.pool.vol;
                for (var i = 0; i < sim.blobs.length; i++) t += sim.blobs[i].vol;
                return t;
            };

            seedState();
            updateTails();
            return sim;
        }

        // Lamp i of count lamps owns a contiguous slice of floor(SLOTS / count) slots
        function lampSlice(i, count) {
            var per = Math.floor(LAVA.SLOTS / Math.max(1, count));
            return { start: i * per, count: per };
        }

        function computeFillLayout(cssW, cssH, dpr) {
            cssW = Math.max(0, Number(cssW) || 0);
            cssH = Math.max(0, Number(cssH) || 0);
            dpr = lavaClamp(Number(dpr) || 1, 1, 2);
            return { masked: false, count: 1, cellW: cssW, cssW: cssW, cssH: cssH, dpr: dpr, lamps: [{
                index: 0, cellX: 0, cellW: cssW, cx: cssW / 2,
                glass: { left: 0, top: 0, width: cssW, height: cssH },
                rect: [0, 0, cssW * dpr, cssH * dpr]
            }] };
        }

        // ---- Colors
        var PRESETS = {
            classic: { wax: '#FF4A1F', liquid: '#7A3A08' },
            ocean:   { wax: '#F4F7FA', liquid: '#0B3D91' },
            violet:  { wax: '#FF5FB0', liquid: '#4A1A7A' },
            jungle:  { wax: '#FFD23F', liquid: '#145A32' }
        };

        // '#RGB', '#RRGGBB' or Qt-style '#AARRGGBB' -> [r, g, b] in 0..1. Garbage -> fallback.
        function parseHexColor(value, fallback) {
            var m = /^#?([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.exec(String(value == null ? '' : value).trim());
            if (!m) return fallback ? parseHexColor(fallback) : [0, 0, 0];
            var h = m[1];
            if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
            if (h.length === 8) h = h.slice(2);
            return [parseInt(h.slice(0, 2), 16) / 255, parseInt(h.slice(2, 4), 16) / 255, parseInt(h.slice(4, 6), 16) / 255];
        }

        function resolveColors(preset, accentHex, backgroundHex) {
            var backdrop = parseHexColor(backgroundHex, PRESETS.classic.liquid);
            var p = Object.prototype.hasOwnProperty.call(PRESETS, preset) ? PRESETS[preset] : null;
            if (p) return { wax: parseHexColor(p.wax), liquid: parseHexColor(p.liquid), backdrop: backdrop };
            return { wax: parseHexColor(accentHex, PRESETS.classic.wax), liquid: backdrop, backdrop: backdrop };
        }

        function relativeLuminance(rgb) {
            var c = rgb.map(function (v) { return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
            return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
        }

        function contrastRatio(a, b) {
            var la = relativeLuminance(a), lb = relativeLuminance(b);
            return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
        }

        // Dark text needs a light halo to stay legible over the wax/liquid; light text keeps the dark one.
        function haloFor(hex) {
            return relativeLuminance(parseHexColor(hex, '#FFFFFF')) < 0.18 ? '255,255,255' : '0,0,0';
        }

        // ---- Lamp geometry (shared by the shader uniforms, the overlay and the pointer mapping)
        var LAMP_GEOM = {
            CAP: 0.08,              // cap height / lamp height
            GLASS: 0.62,            // glass height / lamp height
            BASE: 0.30,             // base height / lamp height
            INTERIOR_ASPECT: 0.42,  // glass width at the widest point (bottom) / glass height
            TOP_RATIO: 0.8,         // glass top width / glass bottom width
            CAP_TOP: 0.45,          // cap top width / glass width
            BASE_TOP: 0.9,          // base top width / glass width
            BASE_BOTTOM: 1.25,      // base bottom width / glass width
            MARGIN: 0.92,           // the lamp fills this fraction of its cell
            CORNER: 0.04            // bottle corner radius in lamp units
        };

        // All values in CSS px with a top-left origin, except rect (buffer px, bottom-left origin).
        function computeLampLayout(cssW, cssH, count, dpr) {
            cssW = Math.max(0, Number(cssW) || 0);
            cssH = Math.max(0, Number(cssH) || 0);
            count = lavaClamp(Math.floor(Number(count) || 1), 1, 6);
            dpr = lavaClamp(Number(dpr) || 1, 1, 2);
            var G = LAMP_GEOM;
            var lampAspect = G.GLASS * G.INTERIOR_ASPECT * G.BASE_BOTTOM;
            var cellW = cssW / count;
            var lampH = Math.min(cssH * G.MARGIN, cellW * G.MARGIN / lampAspect);
            var lamps = [];
            for (var i = 0; i < count; i++) {
                var cx = cellW * (i + 0.5);
                var top = (cssH - lampH) / 2;
                var capH = lampH * G.CAP, glassH = lampH * G.GLASS, baseH = lampH * G.BASE;
                var glassW = glassH * G.INTERIOR_ASPECT;
                var glassTop = top + capH, glassBottom = glassTop + glassH;
                lamps.push({
                    index: i, cellX: cellW * i, cellW: cellW, cx: cx,
                    cap: { top: top, bottom: glassTop, topW: glassW * G.CAP_TOP, bottomW: glassW * G.TOP_RATIO },
                    glass: { left: cx - glassW / 2, top: glassTop, width: glassW, height: glassH },
                    base: { top: glassBottom, bottom: glassBottom + baseH, topW: glassW * G.BASE_TOP, bottomW: glassW * G.BASE_BOTTOM },
                    rect: [(cx - glassW / 2) * dpr, (cssH - glassBottom) * dpr, glassW * dpr, glassH * dpr]
                });
            }
            return { masked: true, count: count, cellW: cellW, cssW: cssW, cssH: cssH, dpr: dpr, lamps: lamps };
        }

        // Lamp units: interior height 1, width = aspect, y up. Ignores the corner rounding.
        function insideBottle(x, y, aspect) {
            if (!(y >= 0 && y <= 1) || !(aspect > 0)) return false;
            var hw = 0.5 * aspect * (1 - (1 - LAMP_GEOM.TOP_RATIO) * y);
            return Math.abs(x - aspect / 2) <= hw;
        }

        // CSS px (relative to the container) -> { lamp, x, y } in that lamp's units, or null
        function mapPointer(px, py, layout) {
            if (!layout || !(layout.cellW > 0) || !isFinite(px) || !isFinite(py)) return null;
            if (!layout.masked && (px < 0 || px > layout.cssW || py < 0 || py > layout.cssH)) return null;
            var i = layout.masked ? Math.floor(px / layout.cellW) : 0;
            if (i < 0 || i >= layout.lamps.length) return null;
            var g = layout.lamps[i].glass;
            if (!(g.height > 0)) return null;
            var x = (px - g.left) / g.height;
            var y = 1 - (py - g.top) / g.height;
            if (layout.masked && !insideBottle(x, y, g.width / g.height)) return null;
            return { lamp: i, x: x, y: y };
        }
        // @testable-end

        // ================================================================
        // Widget state
        // ================================================================
        var MAX_LAMPS = 6;
        var FRAME_MIN = 1 / 60 - 0.002;   // render at most 60 times per second
        var KERNEL_R = 0.87;              // a lone kernel's iso contour sits at r / 0.87, so upload r * 0.87
        var ZERO_TAIL = { x: 0, y: 0, r: 0, w: 0 };

        var mediaViewer = null;
        var cfg = {
            style: 'fill',
            preset: 'classic',
            heat: 5,
            wax: 5,
            title: '',
            textColor: '#FFFFFF',
            accentColor: '#FF4A1F',
            bgColor: '#7A3A08',
            transparency: 100
        };
        var colors = resolveColors(cfg.preset, cfg.accentColor, cfg.bgColor);

        var container = document.getElementById('container');
        var glCanvas = document.getElementById('gl');
        var overlay = document.getElementById('overlay');

        var gl = null, program = null, uni = {}, glReady = false;
        var layout = computeFillLayout(0, 0, 1);
        var lamps = [];
        var baseSeed = (Math.random() * 1e9) >>> 0;
        var running = false, lastRender = 0;

        var blobBuf = new Float32Array(LAVA.SLOTS * 4);
        var tailBuf = new Float32Array(LAVA.SLOTS * 4);
        var poolBuf = new Float32Array(MAX_LAMPS * 4);
        var rectBuf = new Float32Array(MAX_LAMPS * 4);
        var sliceBuf = new Int32Array(MAX_LAMPS * 2);

        function rgbToCss(c) {
            return 'rgb(' + Math.round(c[0] * 255) + ',' + Math.round(c[1] * 255) + ',' + Math.round(c[2] * 255) + ')';
        }

        // ================================================================
        // WebGL2
        // ================================================================
        function compileShader(type, id) {
            var sh = gl.createShader(type);
            gl.shaderSource(sh, document.getElementById(id).textContent.trim());
            gl.compileShader(sh);
            if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
                console.error('QK Lava Lamp shader: ' + gl.getShaderInfoLog(sh));
                return null;
            }
            return sh;
        }

        function initGL() {
            glReady = false;
            if (!gl) {
                try {
                    gl = glCanvas.getContext('webgl2', {
                        alpha: true, premultipliedAlpha: true, antialias: false, depth: false,
                        stencil: false, preserveDrawingBuffer: false, powerPreference: 'high-performance'
                    });
                } catch (e) { gl = null; }
            }
            if (!gl || gl.isContextLost()) return false;
            var vs = compileShader(gl.VERTEX_SHADER, 'vs');
            var fs = compileShader(gl.FRAGMENT_SHADER, 'fs');
            if (!vs || !fs) return false;
            program = gl.createProgram();
            gl.attachShader(program, vs);
            gl.attachShader(program, fs);
            gl.linkProgram(program);
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error('QK Lava Lamp link: ' + gl.getProgramInfoLog(program));
                return false;
            }
            var vao = gl.createVertexArray();
            gl.bindVertexArray(vao);
            var buf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
            var loc = gl.getAttribLocation(program, 'aPos');
            gl.enableVertexAttribArray(loc);
            gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
            ['uBlobs', 'uTails', 'uPool', 'uLampRect', 'uLampSlice', 'uLampCount', 'uStyle', 'uWax',
             'uLiquid', 'uOpacity', 'uTime', 'uResolution', 'uBottle'].forEach(function (n) {
                uni[n] = gl.getUniformLocation(program, n);
            });
            gl.clearColor(0, 0, 0, 0);
            glReady = true;
            return true;
        }

        function showFallback() {
            glReady = false;
            container.classList.add('no-gl');
        }

        glCanvas.addEventListener('webglcontextlost', function (e) {
            e.preventDefault();
            glReady = false;
            container.classList.add('no-gl');   // liquid gradient until the restore
        }, false);
        glCanvas.addEventListener('webglcontextrestored', function () {
            if (initGL()) container.classList.remove('no-gl');
            else showFallback();
        }, false);

        function render(time) {
            if (!glReady) return;
            var w = glCanvas.width, h = glCanvas.height;
            blobBuf.fill(0);
            tailBuf.fill(0);
            for (var i = 0; i < lamps.length && i < MAX_LAMPS; i++) {
                var sim = lamps[i].sim;
                var slice = lampSlice(i, layout.count);
                var first = slice.start;
                var n = Math.min(sim.blobs.length, slice.count);
                for (var k = 0; k < n; k++) {
                    var b = sim.blobs[k], t = sim.tails[k] || ZERO_TAIL, o = (first + k) * 4;
                    // A bud or a split child starts at radius 0, and the shader divides by r^2
                    blobBuf[o] = b.x; blobBuf[o + 1] = b.y; blobBuf[o + 2] = Math.max(b.r * KERNEL_R, 1e-6); blobBuf[o + 3] = b.stretch;
                    tailBuf[o] = t.x; tailBuf[o + 1] = t.y; tailBuf[o + 2] = Math.max(t.r * KERNEL_R, 1e-6); tailBuf[o + 3] = t.w;
                }
                sliceBuf[i * 2] = first;
                sliceBuf[i * 2 + 1] = n;
                poolBuf[i * 4] = 0; poolBuf[i * 4 + 1] = sim.width; poolBuf[i * 4 + 2] = 0; poolBuf[i * 4 + 3] = sim.pool.thickness * KERNEL_R;
                if (layout.masked) rectBuf.set(layout.lamps[i].rect, i * 4);
                else rectBuf.set([0, 0, w, h], i * 4);
            }
            gl.viewport(0, 0, w, h);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.useProgram(program);
            gl.uniform4fv(uni.uBlobs, blobBuf);
            gl.uniform4fv(uni.uTails, tailBuf);
            gl.uniform4fv(uni.uPool, poolBuf);
            gl.uniform4fv(uni.uLampRect, rectBuf);
            gl.uniform2iv(uni.uLampSlice, sliceBuf);
            gl.uniform1i(uni.uLampCount, Math.max(1, Math.min(lamps.length, MAX_LAMPS)));
            gl.uniform1i(uni.uStyle, layout.masked ? 1 : 0);
            gl.uniform3fv(uni.uWax, colors.wax);
            gl.uniform3fv(uni.uLiquid, colors.liquid);
            gl.uniform1f(uni.uOpacity, cfg.transparency / 100);
            // Wrap keeps float32 precision; the shimmer rates 0.4, 0.25 and 0.3 are seamless at 40 pi
            gl.uniform1f(uni.uTime, time % (40 * Math.PI));
            gl.uniform2f(uni.uResolution, w, h);
            gl.uniform2f(uni.uBottle, LAMP_GEOM.TOP_RATIO, LAMP_GEOM.CORNER);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
        }

        // ================================================================
        // Layout, simulations and the Lamp overlay
        // ================================================================
        function readLampCount() {
            return parseInt(getComputedStyle(document.documentElement).getPropertyValue('--lamp-count'), 10) || 1;
        }

        function lampAspect(i) {
            var g = layout.lamps[i].glass;
            return g.width / g.height;
        }

        function buildSims() {
            // Lamp style: the walls narrow with the bottle. Fill style: straight walls.
            var taper = layout.masked ? LAMP_GEOM.TOP_RATIO : 1;
            lamps = [];
            for (var i = 0; i < layout.count; i++) {
                lamps.push({ sim: createSim({ seed: baseSeed + i * 7919, aspect: lampAspect(i),
                                              heat: cfg.heat, waxAmount: cfg.wax,
                                              cap: lampSlice(i, layout.count).count, taper: taper }) });
            }
        }

        function relayout() {
            var w = container.clientWidth, h = container.clientHeight;
            if (!w || !h) return;
            var dpr = lavaClamp(window.devicePixelRatio || 1, 1, 2);
            var bw = Math.max(1, Math.round(w * dpr)), bh = Math.max(1, Math.round(h * dpr));
            glCanvas.width = bw; glCanvas.height = bh;
            overlay.width = bw; overlay.height = bh;
            var prevCount = layout.count, prevMasked = layout.masked;
            layout = (cfg.style === 'lamp') ? computeLampLayout(w, h, readLampCount(), dpr) : computeFillLayout(w, h, dpr);
            if (!lamps.length || layout.count !== prevCount || layout.masked !== prevMasked) {
                buildSims();
            } else {
                for (var i = 0; i < lamps.length; i++) lamps[i].sim.resize(lampAspect(i));
            }
            drawOverlay();
        }

        function drawMetal(ctx, cx, top, bottom, topW, bottomW, ext) {
            ext = ext || 0;
            var g = ctx.createLinearGradient(cx - bottomW / 2, 0, cx + bottomW / 2, 0);
            g.addColorStop(0, '#1b1d20');
            g.addColorStop(0.28, '#8d949b');
            g.addColorStop(0.42, '#d9dde1');
            g.addColorStop(0.6, '#5d646b');
            g.addColorStop(1, '#16181a');
            ctx.beginPath();
            ctx.moveTo(cx - topW / 2, top);
            ctx.lineTo(cx + topW / 2, top);
            ctx.lineTo(cx + bottomW / 2, bottom);
            if (ext) ctx.lineTo(cx + bottomW / 2, bottom + ext);
            if (ext) ctx.lineTo(cx - bottomW / 2, bottom + ext);
            ctx.lineTo(cx - bottomW / 2, bottom);
            ctx.closePath();
            ctx.fillStyle = g;
            ctx.fill();
            ctx.save();
            ctx.clip();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';   // brushed lines
            for (var y = top; y < bottom + ext; y += 3) ctx.fillRect(cx - bottomW / 2, y, bottomW, 1);
            ctx.restore();
        }

        function drawGlassRims(ctx, L) {
            var g = L.glass;
            var topW = g.width * LAMP_GEOM.TOP_RATIO;
            var lw = Math.max(1, g.width * 0.015);
            ctx.save();
            ctx.lineWidth = lw;
            ctx.lineCap = 'round';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.beginPath();
            ctx.moveTo(L.cx - topW / 2 + lw * 2, g.top + LAMP_GEOM.CORNER * g.height + lw * 2);
            ctx.lineTo(L.cx - g.width / 2 + lw * 2, g.top + g.height - lw * 2);
            ctx.stroke();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
            ctx.beginPath();
            ctx.moveTo(L.cx + topW / 2 - lw * 2, g.top + LAMP_GEOM.CORNER * g.height + lw * 2);
            ctx.lineTo(L.cx + g.width / 2 - lw * 2, g.top + g.height - lw * 2);
            ctx.stroke();
            ctx.restore();
        }

        function drawOverlay() {
            var ctx = overlay.getContext('2d');
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, overlay.width, overlay.height);
            if (!layout.masked) return;
            ctx.setTransform(layout.dpr, 0, 0, layout.dpr, 0, 0);
            for (var i = 0; i < layout.lamps.length; i++) {
                var L = layout.lamps[i];
                drawMetal(ctx, L.cx, L.cap.top, L.cap.bottom, L.cap.topW, L.cap.bottomW, LAMP_GEOM.CORNER * L.glass.height);
                drawMetal(ctx, L.cx, L.base.top, L.base.bottom, L.base.topW, L.base.bottomW);
                drawGlassRims(ctx, L);
            }
        }

        // ================================================================
        // Frame loop: physics by real elapsed time, render at most 60 FPS
        // ================================================================
        function frame(nowMs) {
            if (!running) return;
            requestAnimationFrame(frame);
            var now = nowMs / 1000;
            if (!lastRender) lastRender = now;
            var elapsed = now - lastRender;
            if (elapsed < FRAME_MIN) return;
            lastRender = now;
            for (var i = 0; i < lamps.length; i++) lamps[i].sim.step(elapsed);
            render(now);
        }

        // ================================================================
        // Squircle clip-path (superellipse corners, n=5)
        // ================================================================
        function updateSquircle() {
            var el = document.getElementById('container');
            var w = el.offsetWidth, h = el.offsetHeight;
            if (!w || !h || isNaN(w) || isNaN(h)) return;

            var r = Math.min(w, h) * 0.125;
            r = Math.min(r, w / 2, h / 2);
            var n = 5;
            var ppq = 16;
            var d = [];

            d.push('M' + r.toFixed(1) + ' 0');
            d.push('L' + (w - r).toFixed(1) + ' 0');
            for (var i = 1; i <= ppq; i++) {
                var a = (i / ppq) * Math.PI / 2;
                var sa = Math.pow(Math.sin(a), 2 / n);
                var ca = Math.pow(Math.cos(a), 2 / n);
                d.push('L' + ((w - r) + r * sa).toFixed(1) + ' ' + (r - r * ca).toFixed(1));
            }
            d.push('L' + w.toFixed(1) + ' ' + (h - r).toFixed(1));
            for (var i = 1; i <= ppq; i++) {
                var a = (i / ppq) * Math.PI / 2;
                var sa = Math.pow(Math.sin(a), 2 / n);
                var ca = Math.pow(Math.cos(a), 2 / n);
                d.push('L' + ((w - r) + r * ca).toFixed(1) + ' ' + ((h - r) + r * sa).toFixed(1));
            }
            d.push('L' + r.toFixed(1) + ' ' + h.toFixed(1));
            for (var i = 1; i <= ppq; i++) {
                var a = (i / ppq) * Math.PI / 2;
                var sa = Math.pow(Math.sin(a), 2 / n);
                var ca = Math.pow(Math.cos(a), 2 / n);
                d.push('L' + (r - r * sa).toFixed(1) + ' ' + ((h - r) + r * ca).toFixed(1));
            }
            d.push('L0 ' + r.toFixed(1));
            for (var i = 1; i <= ppq; i++) {
                var a = (i / ppq) * Math.PI / 2;
                var sa = Math.pow(Math.sin(a), 2 / n);
                var ca = Math.pow(Math.cos(a), 2 / n);
                d.push('L' + (r - r * ca).toFixed(1) + ' ' + (r - r * sa).toFixed(1));
            }
            d.push('Z');

            el.style.clipPath = "path('" + d.join(' ') + "')";
        }

        // ================================================================
        // Settings
        // ================================================================
        function readSettings() {
            var prevStyle = cfg.style;
            if (typeof lampStyle !== 'undefined') cfg.style = (lampStyle === 'lamp') ? 'lamp' : 'fill';
            if (typeof colorPreset !== 'undefined') cfg.preset = String(colorPreset);
            if (typeof heat !== 'undefined') cfg.heat = lavaClamp(Number(heat) || 5, 1, 10);
            if (typeof waxAmount !== 'undefined') cfg.wax = lavaClamp(Number(waxAmount) || 5, 1, 10);
            if (typeof textColor !== 'undefined') cfg.textColor = textColor;
            if (typeof accentColor !== 'undefined') cfg.accentColor = accentColor;
            if (typeof backgroundColor !== 'undefined') cfg.bgColor = backgroundColor;
            if (typeof transparency !== 'undefined') {
                var tv = Number(transparency);
                cfg.transparency = isFinite(tv) ? lavaClamp(tv, 0, 100) : 100;
            }
            if (typeof customTitle !== 'undefined') cfg.title = (customTitle == null) ? '' : String(customTitle);
            applySettings(prevStyle !== cfg.style);
        }

        function applySettings(styleChanged) {
            var root = document.documentElement;
            colors = resolveColors(cfg.preset, cfg.accentColor, cfg.bgColor);
            // Parsed to opaque rgb(): a Qt #AARRGGBB value must not make the title translucent
            root.style.setProperty('--text-color', rgbToCss(parseHexColor(cfg.textColor, '#FFFFFF')));
            root.style.setProperty('--halo-color', haloFor(cfg.textColor));
            root.style.setProperty('--bg-color', rgbToCss(colors.backdrop));
            root.style.setProperty('--liquid-color', rgbToCss(colors.liquid));
            root.style.setProperty('--widget-opacity', cfg.transparency / 100);

            var wt = document.getElementById('widget-title');
            wt.textContent = cfg.title;
            wt.style.display = cfg.title ? 'block' : 'none';

            var blur = (typeof glassBlur !== 'undefined') ? glassBlur : 0;
            root.style.setProperty('--bg-blur', blur + 'px');

            container.classList.toggle('lamp-style', cfg.style === 'lamp');
            for (var i = 0; i < lamps.length; i++) {
                lamps[i].sim.setHeat(cfg.heat);
                lamps[i].sim.setWaxAmount(cfg.wax);
            }
            if (styleChanged) {
                lamps = [];
                relayout();
            }
            if (mediaViewer) {
                var bgImage = (typeof backgroundMedia !== 'undefined') ? backgroundMedia : null;
                var media = normalizeMediaConfig(bgImage);
                if (media) { mediaViewer.loadMedia(media); }
                else { mediaViewer.clear(); }
            }
        }

        // ================================================================
        // Touch: drag to stir
        // ================================================================
        var activePointer = null, lastPointer = null;

        function localPoint(e) {
            var r = container.getBoundingClientRect();
            return { x: e.clientX - r.left, y: e.clientY - r.top, t: e.timeStamp / 1000 };
        }

        container.addEventListener('pointerdown', function (e) {
            if (!e.isPrimary) return;
            if (activePointer !== null) { activePointer = null; lastPointer = null; }
            activePointer = e.pointerId;
            try { container.setPointerCapture(e.pointerId); } catch (err) { /* capture is best effort */ }
            lastPointer = localPoint(e);
        });

        container.addEventListener('pointermove', function (e) {
            if (e.pointerId !== activePointer || !lastPointer) return;
            var cur = localPoint(e);
            var dt = cur.t - lastPointer.t;
            if (!(dt > 0)) return;
            var a = mapPointer(lastPointer.x, lastPointer.y, layout);
            var b = mapPointer(cur.x, cur.y, layout);
            lastPointer = cur;
            if (!a || !b || a.lamp !== b.lamp || !lamps[b.lamp]) return;
            lamps[b.lamp].sim.stir(b.x, b.y, (b.x - a.x) / dt, (b.y - a.y) / dt);
        });

        function endPointer(e) {
            if (e.pointerId !== activePointer) return;
            activePointer = null;
            lastPointer = null;
        }
        container.addEventListener('pointerup', endPointer);
        container.addEventListener('pointercancel', endPointer);
        container.addEventListener('lostpointercapture', endPointer);

        // ================================================================
        // iCUE lifecycle
        // ================================================================
        function onInit() {
            if (running) return;
            mediaViewer = new MediaViewer({ container: document.getElementById('media-background') });
            readSettings();
            updateSquircle();
            if (!initGL()) showFallback();
            relayout();
            running = true;
            requestAnimationFrame(frame);
        }

        function onDataUpdated() {
            readSettings();
        }

        new ResizeObserver(function () {
            updateSquircle();
            relayout();
        }).observe(container);

        // Bare assignments (no var) so iCUE's bootstrap can find these.
        icueEvents = {
            "onICUEInitialized": onInit,
            "onDataUpdated": onDataUpdated
        };

        if (typeof iCUE_initialized !== 'undefined' && iCUE_initialized) {
            onInit();
        }

        // Standalone fallback (outside iCUE)
        if (typeof iCUE_initialized === 'undefined') {
            onInit();
        }
    </script>
</body>
</html>
